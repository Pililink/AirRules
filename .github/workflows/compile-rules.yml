name: Compile Sing-Box Rules

on:
  push:
    branches:
      - main
  workflow_dispatch:
  
permissions:
  contents: write

env:
  SING_BOX_VERSION: 1.10.0-beta.4

jobs:
  sync_and_compile:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v3

    - name: Install sing-box
      run: |
        curl -Lo /tmp/sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz
        tar -xzf /tmp/sing-box.tar.gz -C /tmp/
        chmod +x /tmp/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box
        sudo mv /tmp/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box /usr/local/bin/sing-box
        sing-box version

    - name: Validate Clash templates and scripts
      run: |
        python -m pip install ruamel.yaml
        python - <<'PY'
        from pathlib import Path
        from ruamel.yaml import YAML

        yaml = YAML(typ="safe")
        yaml.allow_duplicate_keys = False

        magic_dns_rule = "DOMAIN-SUFFIX,ts.net,🏠 家庭网络"
        custom_ignore_rule = "RULE-SET,myignore,DIRECT"

        for path in Path("clash/config").glob("*.yaml"):
            config = yaml.load(path.read_text(encoding="utf-8"))
            rules = config.get("rules", [])
            assert magic_dns_rule in rules, f"{path}: missing Tailscale MagicDNS rule"
            assert rules.index(magic_dns_rule) < rules.index(custom_ignore_rule), (
                f"{path}: Tailscale MagicDNS must precede myignore"
            )
            print(f"validated {path}")

        ignore_rules = Path("clash/ruleset/ignore.list").read_text(encoding="utf-8").splitlines()
        assert "DOMAIN-SUFFIX,ts.net" not in ignore_rules, (
            "clash/ruleset/ignore.list must not bypass the Tailscale outbound"
        )
        assert "ruleset=🏠 家庭网络,[]DOMAIN-SUFFIX,ts.net" in Path(
            "clash/pililink.ini"
        ).read_text(encoding="utf-8")

        # HuggingFace 模型下载量大,永远不能进 AI 分组(走 🪜 代理域名)。
        hf_domains = ("hf.co", "hf.space", "huggingface.co")
        ai_rules = Path("clash/ruleset/ai.list").read_text(encoding="utf-8")
        assert not any(d in ai_rules for d in hf_domains), (
            "clash/ruleset/ai.list must not contain HuggingFace domains"
        )
        assert all(d in Path("clash/ruleset/proxy.list").read_text(encoding="utf-8") for d in hf_domains), (
            "clash/ruleset/proxy.list must contain HuggingFace domains"
        )

        # sing-box: 本地 myai(command-rules) 必须先于第三方 ai 规则命中;并且 AI 源不得含 HF。
        for path in Path("sing-box/config").glob("*.json"):
            import json as _json
            cfg = _json.loads(path.read_text(encoding="utf-8"))
            tags = [r.get("tag") for r in cfg["route"]["rule_set"]]
            assert "myai" in tags, f"{path}: missing myai rule_set"
            ai_route = next(
                i for i, x in enumerate(cfg["route"]["rules"])
                if (x.get("rule_set") or []) == ["ai"]
            )
            myai_route = [
                i for i, x in enumerate(cfg["route"]["rules"])
                if (x.get("rule_set") or []) == ["myai"]
            ]
            assert myai_route, f"{path}: myai rule missing"
            assert myai_route[0] < ai_route, f"{path}: myai rule must precede ai rule"
            ai_json = _json.loads(Path("sing-box/rules_json/ai.json").read_text(encoding="utf-8"))
            flat = _json.dumps(ai_json, ensure_ascii=False)
            assert not any(d in flat for d in hf_domains), (
                "sing-box/rules_json/ai.json must not contain HuggingFace domains"
            )
        print("validated AI routing constraints")
        PY
        for file in clash/config/*.js loon/config/*.js script/test-sub-store-file-scripts.js; do
          node --check "$file"
        done
        node script/test-sub-store-file-scripts.js

    # - name: Setup Debug Session
    #   uses: csexton/debugger-action@master

    - name: Compile Sing-Box Rules
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/sing-box/rules_srs/
        rm -rf ${GITHUB_WORKSPACE}/sing-box/rules_srs/*
        for file in sing-box/rules_json/*.json; do
          filename=$(basename "$file" .json)
          sing-box rule-set compile "$file" -o "sing-box/rules_srs/${filename}.srs"
        done
    
    - name: Commit compiled rules
      run: |
        cd ${GITHUB_WORKSPACE}
        git config --local user.name "GitHub Actions"
        git config --local user.email "actions@github.com"

        git add .
        if git diff-index --quiet HEAD --; then
          echo "No changes to commit"
          echo "No updates needed"
        else
          git commit -m "Merged sing-box directory from ruleset.skk.moe repository"
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}
