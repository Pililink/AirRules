name: Compile Sing-Box Rules

on:
  push:
    branches:
      - main
  workflow_dispatch:
  
permissions:
  contents: write

env:
  SING_BOX_VERSION: 1.10.0-beta.4

jobs:
  sync_and_compile:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v3

    - name: Install sing-box
      run: |
        curl -Lo /tmp/sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz
        tar -xzf /tmp/sing-box.tar.gz -C /tmp/
        chmod +x /tmp/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box
        sudo mv /tmp/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box /usr/local/bin/sing-box
        sing-box version

    - name: Validate Clash templates and scripts
      run: |
        python -m pip install ruamel.yaml
        python - <<'PY'
        from pathlib import Path
        from ruamel.yaml import YAML

        yaml = YAML(typ="safe")
        yaml.allow_duplicate_keys = False

        magic_dns_rule = "DOMAIN-SUFFIX,ts.net,🏠 家庭网络"
        custom_ignore_rule = "RULE-SET,myignore,DIRECT"

        for path in Path("clash/config").glob("*.yaml"):
            config = yaml.load(path.read_text(encoding="utf-8"))
            rules = config.get("rules", [])
            assert magic_dns_rule in rules, f"{path}: missing Tailscale MagicDNS rule"
            assert rules.index(magic_dns_rule) < rules.index(custom_ignore_rule), (
                f"{path}: Tailscale MagicDNS must precede myignore"
            )
            print(f"validated {path}")

        ignore_rules = Path("clash/ruleset/ignore.list").read_text(encoding="utf-8").splitlines()
        assert "DOMAIN-SUFFIX,ts.net" not in ignore_rules, (
            "clash/ruleset/ignore.list must not bypass the Tailscale outbound"
        )
        assert "ruleset=🏠 家庭网络,[]DOMAIN-SUFFIX,ts.net" in Path(
            "clash/pililink.ini"
        ).read_text(encoding="utf-8")

        # HuggingFace 模型下载量大,永远不能进 AI 分组(走 🪜 代理域名)。
        hf_domains = ("hf.co", "hf.space", "huggingface.co")
        ai_rules = Path("clash/ruleset/ai.list").read_text(encoding="utf-8")
        assert not any(d in ai_rules for d in hf_domains), (
            "clash/ruleset/ai.list must not contain HuggingFace domains"
        )
        assert all(d in Path("clash/ruleset/proxy.list").read_text(encoding="utf-8") for d in hf_domains), (
            "clash/ruleset/proxy.list must contain HuggingFace domains"
        )

        # sing-box: 本地 myai(command-rules) 必须先于第三方 ai 规则命中;并且 AI 源不得含 HF。
        for path in Path("sing-box/config").glob("*.json"):
            import json as _json
            cfg = _json.loads(path.read_text(encoding="utf-8"))
            tags = [r.get("tag") for r in cfg["route"]["rule_set"]]
            assert "myai" in tags, f"{path}: missing myai rule_set"
            ai_route = next(
                i for i, x in enumerate(cfg["route"]["rules"])
                if (x.get("rule_set") or []) == ["ai"]
            )
            myai_route = [
                i for i, x in enumerate(cfg["route"]["rules"])
                if (x.get("rule_set") or []) == ["myai"]
            ]
            assert myai_route, f"{path}: myai rule missing"
            assert myai_route[0] < ai_route, f"{path}: myai rule must precede ai rule"
            ai_json = _json.loads(Path("sing-box/rules_json/ai.json").read_text(encoding="utf-8"))
            flat = _json.dumps(ai_json, ensure_ascii=False)
            assert not any(d in flat for d in hf_domains), (
                "sing-box/rules_json/ai.json must not contain HuggingFace domains"
            )
        print("validated AI routing constraints")

        # PSN 域名必须先于 ChinaDomain：cn 规则集内含 playstation.com / playstation.net /
        # playstationnetwork.com / sony.com / sonyentertainmentnetwork.com，命中即直连；
        # 历史上 game-sony / game-playstation 排在 RULE-SET,cn 之后，两条规则均无法命中。
        psn_rule = "RULE-SET,mypsn,🕹️ PSN 服务"
        psn_domains = [
            "playstation.com",
            "playstation.net",
            "playstationnetwork.com",
            "sonyentertainmentnetwork.com",
            "sony.com",
            "sony.com.cn",
            "sonyinteractive.com",
            "sie.com",
            "scea.com",
            "playstation",
        ]
        psn_wildcards = ["playstation.*", "*.playstation.*"]
        psn_templates = [
            "base-clash-ruleset.yaml",
            "2-subscription-clash-rule-set.yaml",
            "2-subscription-ac-clash-rule-set.yaml",
            "3-subscription-clash-rule-set.yaml",
        ]
        for name in psn_templates:
            cfg = yaml.load((Path("clash/config") / name).read_text(encoding="utf-8"))
            psn_config_rules = cfg["rules"]
            cn_index = next(i for i, r in enumerate(psn_config_rules) if r.startswith("RULE-SET,cn,"))
            assert psn_rule in psn_config_rules, f"{name}: missing {psn_rule}"
            assert psn_config_rules.index(psn_rule) < cn_index, f"{name}: {psn_rule} must precede RULE-SET,cn"
            assert "mypsn" in cfg["rule-providers"], f"{name}: missing rule-provider mypsn"
            # PS 域名已统一为自维护 psn.list，不应再引用第三方 Sony / PlayStation 规则集。
            assert not any(r.startswith(("RULE-SET,game-sony,", "RULE-SET,game-playstation,")) for r in psn_config_rules), (
                f"{name}: PS 域名已并入 psn.list，不要再引用 game-sony / game-playstation"
            )
            assert not any(k in cfg["rule-providers"] for k in ("game-sony", "game-playstation")), (
                f"{name}: 应移除 game-sony / game-playstation provider"
            )
            assert any(g.get("name") == "🕹️ PSN 服务" for g in cfg["proxy-groups"]), (
                f"{name}: missing proxy-group 🕹️ PSN 服务"
            )
            psn_group = next(g for g in cfg["proxy-groups"] if g.get("name") == "🕹️ PSN 服务")
            assert psn_group["proxies"][0] == "REJECT", f"{name}: 🕹️ PSN 服务 must default to REJECT"
            assert psn_group["proxies"] == ["REJECT", "DIRECT", "🎮 游戏服务"], (
                f"{name}: 🕹️ PSN 服务 proxies 应为 [REJECT, DIRECT, 🎮 游戏服务]，实际 {psn_group['proxies']}"
            )
            # 分组引用必须真实存在，否则 Mihomo 直接拒绝加载配置。
            assert any(g.get("name") == "🎮 游戏服务" for g in cfg["proxy-groups"]), (
                f"{name}: 🕹️ PSN 服务 引用了不存在的分组 🎮 游戏服务"
            )
        # 统一规则集必须覆盖全部 PS 域名，且不能混入非 PS 配置行。
        psn_list = Path("clash/ruleset/psn.list").read_text(encoding="utf-8")
        psn_entries = [
            line.strip() for line in psn_list.splitlines()
            if line.strip() and not line.strip().startswith("#")
        ]
        for domain in psn_domains:
            assert f"DOMAIN-SUFFIX,{domain}" in psn_entries, f"clash/ruleset/psn.list missing {domain}"
        for pattern in psn_wildcards:
            assert f"DOMAIN-WILDCARD,{pattern}" in psn_entries, (
                f"clash/ruleset/psn.list missing wildcard {pattern}（各国 playstation.<ccTLD> 靠它覆盖）"
            )
        for entry in psn_entries:
            assert entry.startswith(("DOMAIN-SUFFIX,", "DOMAIN-WILDCARD,")), (
                f"clash/ruleset/psn.list unexpected entry: {entry}"
            )
        print("validated PSN block rules")
        PY
        for file in clash/config/*.js loon/config/*.js script/test-sub-store-file-scripts.js; do
          node --check "$file"
        done
        node script/test-sub-store-file-scripts.js

    # - name: Setup Debug Session
    #   uses: csexton/debugger-action@master

    - name: Compile Sing-Box Rules
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/sing-box/rules_srs/
        rm -rf ${GITHUB_WORKSPACE}/sing-box/rules_srs/*
        for file in sing-box/rules_json/*.json; do
          filename=$(basename "$file" .json)
          sing-box rule-set compile "$file" -o "sing-box/rules_srs/${filename}.srs"
        done
    
    - name: Commit compiled rules
      run: |
        cd ${GITHUB_WORKSPACE}
        git config --local user.name "GitHub Actions"
        git config --local user.email "actions@github.com"

        git add .
        if git diff-index --quiet HEAD --; then
          echo "No changes to commit"
          echo "No updates needed"
        else
          git commit -m "Merged sing-box directory from ruleset.skk.moe repository"
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}
